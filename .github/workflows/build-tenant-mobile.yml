name: Bankneza White-Label Mobile Build

on:
  workflow_dispatch:
    inputs:
      buildId:
        required: true
        type: string
      tenantSlug:
        required: true
        type: string
      appName:
        required: true
        type: string
      androidPackageId:
        required: true
        type: string
      iosBundleId:
        required: true
        type: string
      platform:
        required: true
        type: string
      versionName:
        required: true
        type: string
      buildNumber:
        required: true
        type: string
      primaryColor:
        required: false
        default: '#001C71'
        type: string
      accentColor:
        required: false
        default: '#0066FF'
        type: string
      apiBaseUrl:
        required: true
        type: string
      logoUrl:
        required: false
        default: ''
        type: string
      splashUrl:
        required: false
        default: ''
        type: string
      splashBgColor:
        required: false
        default: '#001C71'
        type: string
      callbackUrl:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - uses: actions/setup-java@v4
        if: inputs.platform == 'ANDROID_APK' || inputs.platform == 'ANDROID_AAB'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        if: inputs.platform == 'ANDROID_APK' || inputs.platform == 'ANDROID_AAB'
        with:
          cache-read-only: false

      - uses: expo/expo-github-action@v8
        if: inputs.platform != 'ANDROID_APK' && inputs.platform != 'ANDROID_AAB'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prepare Branded Icon & Splash
        env:
          LOGO_URL: ${{ inputs.logoUrl }}
          SPLASH_URL: ${{ inputs.splashUrl }}
        run: |
          mkdir -p assets
          if [ -n "$LOGO_URL" ]; then
            curl -fsSL "$LOGO_URL" -o assets/icon.png || true
          fi
          if [ -n "$SPLASH_URL" ]; then
            curl -fsSL "$SPLASH_URL" -o assets/splash.png || cp assets/icon.png assets/splash.png 2>/dev/null || true
          else
            cp assets/icon.png assets/splash.png 2>/dev/null || true
          fi

      - name: Build Android APK / AAB Directly (Zero Queue)
        id: android_local
        if: inputs.platform == 'ANDROID_APK' || inputs.platform == 'ANDROID_AAB'
        env:
          TENANT_SLUG: ${{ inputs.tenantSlug }}
          APP_NAME: ${{ inputs.appName }}
          ANDROID_PACKAGE: ${{ inputs.androidPackageId }}
          IOS_BUNDLE_ID: ${{ inputs.iosBundleId }}
          VERSION_NAME: ${{ inputs.versionName }}
          BUILD_NUMBER: ${{ inputs.buildNumber }}
          PRIMARY_COLOR: ${{ inputs.primaryColor }}
          ACCENT_COLOR: ${{ inputs.accentColor }}
          API_BASE_URL: ${{ inputs.apiBaseUrl }}
          EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
        run: |
          npx expo prebuild --platform android --clean --no-install
          mkdir -p android/app/src/main/assets/fonts
          cp node_modules/@expo/vector-icons/build/vendor/react-native-vector-icons/Fonts/*.ttf android/app/src/main/assets/fonts/ 2>/dev/null || true
          sed -i 's/1\.9\.24/1.9.25/g' android/build.gradle android/gradle.properties 2>/dev/null || true
          sed -i "s/kotlin-gradle-plugin')/kotlin-gradle-plugin:1.9.25')/g" android/build.gradle
          sed -i 's/kotlin-gradle-plugin")/kotlin-gradle-plugin:1.9.25")/g' android/build.gradle
          echo "android.kotlinVersion=1.9.25" >> android/gradle.properties
          cd android
          chmod +x gradlew
          if [ "${{ inputs.platform }}" = "ANDROID_AAB" ]; then
            ./gradlew bundleRelease --no-daemon --parallel --build-cache -PkotlinVersion=1.9.25 -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
            ARTIFACT_FILE=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
            EXT="aab"
          else
            ./gradlew assembleRelease --no-daemon --parallel --build-cache -PkotlinVersion=1.9.25 -PreactNativeArchitectures=arm64-v8a
            ARTIFACT_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
            EXT="apk"
          fi
          echo "Built artifact: $ARTIFACT_FILE"
          UPLOAD_URL="${{ inputs.callbackUrl }}"
          UPLOAD_URL="${UPLOAD_URL%/callback}/upload-artifact?ext=${EXT}"
          RESP=$(curl -fsSL -X POST "$UPLOAD_URL" \
            -H "Content-Type: application/octet-stream" \
            -H "X-Build-Secret: ${{ secrets.MOBILE_BUILD_CALLBACK_SECRET }}" \
            --data-binary "@$ARTIFACT_FILE")
          echo "Upload response: $RESP"
          ARTIFACT_URL=$(echo "$RESP" | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8')); console.log(d?.data?.artifactUrl || '');")
          echo "artifact_url=$ARTIFACT_URL" >> "$GITHUB_OUTPUT"

      - name: Run EAS Cloud Build (iOS / Combined)
        id: eas
        if: inputs.platform != 'ANDROID_APK' && inputs.platform != 'ANDROID_AAB'
        env:
          TENANT_SLUG: ${{ inputs.tenantSlug }}
          APP_NAME: ${{ inputs.appName }}
          ANDROID_PACKAGE: ${{ inputs.androidPackageId }}
          IOS_BUNDLE_ID: ${{ inputs.iosBundleId }}
          VERSION_NAME: ${{ inputs.versionName }}
          BUILD_NUMBER: ${{ inputs.buildNumber }}
          PRIMARY_COLOR: ${{ inputs.primaryColor }}
          ACCENT_COLOR: ${{ inputs.accentColor }}
          API_BASE_URL: ${{ inputs.apiBaseUrl }}
          EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
        run: |
          if [ "${{ inputs.platform }}" = "IOS_IPA" ]; then
            OUT=$(eas build --platform ios --profile production --non-interactive --json)
          else
            OUT=$(eas build --platform all --profile production --non-interactive --json)
          fi
          ARTIFACT_URL=$(echo "$OUT" | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8')); const item=Array.isArray(d)?d[0]:d; console.log(item?.artifacts?.buildUrl || item?.buildUrl || '');")
          echo "artifact_url=$ARTIFACT_URL" >> "$GITHUB_OUTPUT"

      - name: Notify Bankneza Mobile Factory
        if: always()
        run: |
          ARTIFACT_URL="${{ steps.android_local.outputs.artifact_url || steps.eas.outputs.artifact_url }}"
          STATUS="COMPLETED"
          if [ "${{ job.status }}" != "success" ] || [ -z "$ARTIFACT_URL" ]; then
            STATUS="FAILED"
          fi
          curl -s -X POST "${{ inputs.callbackUrl }}" \
            -H "Content-Type: application/json" \
            -H "X-Build-Secret: ${{ secrets.MOBILE_BUILD_CALLBACK_SECRET }}" \
            -d "{\"status\":\"$STATUS\",\"artifactUrl\":\"$ARTIFACT_URL\"}"
